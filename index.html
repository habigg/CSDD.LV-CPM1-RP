<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CPM1 Roleplay | CSDD</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #141c30;
      --panel2: #1b2740;
      --text: #f3f6fc;
      --muted: #aab6ca;
      --accent: #43d9a3;
      --border: #293650;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header {
      background: #10182a;
      border-bottom: 1px solid var(--border);
      padding: 22px 6%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand {
      font-size: 23px;
      font-weight: 800;
    }

    .brand span { color: var(--accent); }

    .badge {
      color: var(--accent);
      border: 1px solid #2a795e;
      background: #102d28;
      border-radius: 20px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: bold;
    }

    .hero {
      padding: 55px 6% 35px;
      background: linear-gradient(120deg, #101a30, #0b1020);
    }

    .hero h1 {
      margin: 0 0 12px;
      font-size: clamp(32px, 5vw, 50px);
    }

    .hero h1 span { color: var(--accent); }
