<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CPM1 Roleplay | CSDD</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b1120;
  color: #f1f5f9;
}

header {
  background: #111b2e;
  padding: 22px;
  border-bottom: 2px solid #20c997;
}

.logo {
  font-size: 25px;
  font-weight: bold;
}

.logo span {
  color: #20c997;
}

header p {
  color: #aab6ca;
  margin-bottom: 0;
}

main {
  max-width: 1100px;
  margin: auto;
  padding: 25px 18px;
}

.hero {
  padding: 30px 0;
}

.hero h1 {
  font-size: 36px;
  margin-bottom: 10px;
}

.hero h1 span {
  color: #20c997;
}

.hero p {
  color: #aab6ca;
  line-height: 1.7;
}

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 15px;
  margin: 25px 0;
}

.card {
  background: #172238;
  padding: 20px;
  border: 1px solid #2b3a54;
  border-radius: 12px;
}

.card p {
  color: #aab6ca;
  margin-top: 0;
}

.card h2 {
  font-size: 30px;
  margin-bottom: 0;
  color: #20c997;
}

nav {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin: 25px 0;
}

nav button {
  padding: 12px 16px;
  border: 1px solid #34445f;
  border-radius: 8px;
  background: #172238;
  color: white;
  cursor: pointer;
}

nav button:hover,
nav button.active {
  background: #20c997;
  color: #071b17;
}

.section {
  background: #172238;
  border: 1px solid #2b3a54;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 25px;
}

.table-container {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 400px;
}

th, td {
  padding: 14px 12px;
  text-align: left;
  border-bottom: 1px solid #34445f;
}

th {
  color: #20c997;
}

tr:last-child td {
  border-bottom: none;
}

.notice {
  color: #aab6ca;
  line-height: 1.7;
}

footer {
  border-top: 1px solid #2b3a54;
  text-align: center;
  color: #aab6ca;
  padding: 25px;
  margin-top: 30px;
}

@media (max-width: 600px) {
  .hero h1 {
    font-size: 29px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">CPM1 <span>ROLEPLAY</span></div>
  <p>Transportlīdzekļu un vadītāju reģistrs</p>
</header>

<main>

  <section class="hero">
    <h1>CPM1 <span>CSDD</span></h1>
    <p>
      Laipni lūdzam CPM1 Roleplay neoficiālajā CSDD portālā.
      Šeit pieejama spēles transportlīdzekļu, vadītāju,
      tehniskās apskates un sodu informācija.
    </p>
  </section>

  <section class="cards">
    <div class="card">
      <p>Transportlīdzekļi</p>
      <h2 id="carCount">2</h2>
    </div>

    <div class="card">
      <p>Vadītāji</p>
      <h2 id="driverCount">1</h2>
    </div>

    <div class="card">
      <p>Aktīvie sodi</p>
      <h2 id="fineCount">1</h2>
    </div>

    <div class="card">
      <p>Apskašu ieraksti</p>
      <h2 id="inspectionCount">2</h2>
    </div>
  </section>

  <nav>
    <button class="active" onclick="showPage('cars', this)">
      Transportlīdzekļi
    </button>

    <button onclick="showPage('inspections', this)">
      Tehniskā apskate
    </button>

    <button onclick="showPage('drivers', this)">
      Vadītāji
    </button>

    <button onclick="showPage('fines', this)">
      Sodi
    </button>
  </nav>

    <h
